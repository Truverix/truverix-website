<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Admin Login — TruveriX</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',-apple-system,Arial,sans-serif;background:#020B1D;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.box{background:#fff;border-radius:14px;padding:36px;max-width:380px;width:100%;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.logo{font-size:22px;font-weight:800;margin-bottom:4px}
.logo .tr{color:#020B1D}.logo .x{color:#38B6FF}
.sub{font-size:12px;color:#64748B;margin-bottom:24px}
label{display:block;font-size:11px;font-weight:700;color:#020B1D;margin-bottom:5px}
input{width:100%;padding:10px 14px;border:1.5px solid #E2E8F0;border-radius:8px;font-size:13px;margin-bottom:16px;outline:none}
input:focus{border-color:#2563EB}
button{width:100%;padding:12px;background:linear-gradient(135deg,#2563EB,#38B6FF);color:#fff;border:none;border-radius:8px;font-size:13px;font-weight:700;cursor:pointer}
button:disabled{opacity:.6;cursor:default}
.err{color:#DC2626;font-size:12px;margin-bottom:12px;display:none}
</style>
</head>
<body>
<div class="box">
  <div class="logo"><span class="tr">Truveri</span><span class="x">X</span></div>
  <div class="sub">Admin reporting — leads &amp; consent records</div>
  <div class="err" id="err"></div>
  <form id="login-form">
    <label>Username</label>
    <input type="text" id="username" autocomplete="username" required/>
    <label>Password</label>
    <input type="password" id="password" autocomplete="current-password" required/>
    <button type="submit" id="btn">Sign in</button>
  </form>
</div>
<script>
document.getElementById('login-form').addEventListener('submit', async function(e){
  e.preventDefault();
  var btn = document.getElementById('btn');
  var err = document.getElementById('err');
  err.style.display = 'none';
  btn.disabled = true;
  btn.textContent = 'Signing in…';
  try {
    var resp = await fetch('/api/admin/login', {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({
        username: document.getElementById('username').value,
        password: document.getElementById('password').value
      })
    });
    if (resp.ok) {
      window.location.href = '/admin/dashboard.html';
    } else {
      var data = await resp.json().catch(function(){ return {}; });
      err.textContent = data.error || 'Sign in failed';
      err.style.display = 'block';
      btn.disabled = false;
      btn.textContent = 'Sign in';
    }
  } catch (e2) {
    err.textContent = 'Network error — please try again';
    err.style.display = 'block';
    btn.disabled = false;
    btn.textContent = 'Sign in';
  }
});
</script>
</body>
</html>
